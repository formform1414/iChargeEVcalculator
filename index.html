<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
  <title>iCharge Calculator</title>
  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS v5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="asset/favicon.png" type="image/x-icon">
</head>

<body>
  <header>
    <!-- place navbar here -->
    <nav class="navbar bg-1 fg-2">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="asset/iChargeLogo.png" alt="Logo" height="40" class="d-inline-block align-text-top" />
        </a>
      </div>
    </nav>
  </header>
  <main>
    <div
      class="container shadow-sm rounded p-4 bg-body d-flex flex-column justify-content-center align-items-center mt-5">
      <h1>คำนวณค่าชาร์จรถ EV</h1>

      <div>
        <div class="mb-3 row">
          <label for="inputNum" class="col-sm-6 col-form-label"> ความจุแบตเตอรี่(kWh)</label>
          <div class="col-sm-6">
            <input type="number" class="form-control" id="battery" placeholder="0">
          </div>
        </div>
        <div class="mb-3 row">
          <label for="inputNum" class="col-sm-6 col-form-label"> แบตเตอรี่ที่เหลือ(%)</label>
          <div class="col-sm-6">
            <input type="number" class="form-control" id="percentLeft" placeholder="0">
          </div>
        </div>
        <div class="mb-4 row">
          <label for="inputNum" class="col-sm-6 col-form-label">อัตราค่าไฟฟ้าต่อหน่วย</label>
          <div class="col-sm-6">
            <input type="number" class="form-control" id="unitRate" placeholder="0">
          </div>
        </div>
      </div>
      <h2 id="result"></h2>
      <div class="row">
        <button onclick="totalCost()" class="btn btn-primary ">คลิกเพื่อคำนวณ</button>
        <button onclick="resetData()" class="reset">รีเซ็ท</button>
      </div>
      <p>*คำนวณค่าใช้จ่ายโดยประมาณสำหรับชาร์จรถ EV ถึง 100% ผลลัพธ์เป็นเพียงการประเมินเบื้องต้น
        ค่าใช้จ่ายจริงอาจแตกต่างขึ้นอยู่กับสภาพแบตเตอรี่และตัวรถ*</p>
    </div>
  </main>
  <!-- Bootstrap JavaScript Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
